<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="380" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e3a8a">畳み込みのしくみと出力サイズ</text>

  <!-- Input 5x5 grid -->
  <text x="135" y="62" text-anchor="middle" font-size="14" fill="#334155">入力　5×5</text>
  <g stroke="#94a3b8" stroke-width="1.5">
    <!-- highlight 3x3 region (top-left) -->
    <rect x="40" y="72" width="102" height="102" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
    <!-- 5x5 cells -->
    <g fill="none">
      <rect x="40" y="72" width="34" height="34"/><rect x="74" y="72" width="34" height="34"/><rect x="108" y="72" width="34" height="34"/><rect x="142" y="72" width="34" height="34"/><rect x="176" y="72" width="34" height="34"/>
      <rect x="40" y="106" width="34" height="34"/><rect x="74" y="106" width="34" height="34"/><rect x="108" y="106" width="34" height="34"/><rect x="142" y="106" width="34" height="34"/><rect x="176" y="106" width="34" height="34"/>
      <rect x="40" y="140" width="34" height="34"/><rect x="74" y="140" width="34" height="34"/><rect x="108" y="140" width="34" height="34"/><rect x="142" y="140" width="34" height="34"/><rect x="176" y="140" width="34" height="34"/>
      <rect x="40" y="174" width="34" height="34"/><rect x="74" y="174" width="34" height="34"/><rect x="108" y="174" width="34" height="34"/><rect x="142" y="174" width="34" height="34"/><rect x="176" y="174" width="34" height="34"/>
      <rect x="40" y="208" width="34" height="34"/><rect x="74" y="208" width="34" height="34"/><rect x="108" y="208" width="34" height="34"/><rect x="142" y="208" width="34" height="34"/><rect x="176" y="208" width="34" height="34"/>
    </g>
  </g>
  <text x="91" y="266" text-anchor="middle" font-size="12" fill="#1d4ed8">3×3 の範囲を見る</text>

  <!-- Kernel -->
  <text x="350" y="120" text-anchor="middle" font-size="14" fill="#334155">フィルタ (3×3)</text>
  <g stroke="#b45309" stroke-width="1.5" fill="#fde68a">
    <rect x="312" y="132" width="26" height="26"/><rect x="338" y="132" width="26" height="26"/><rect x="364" y="132" width="26" height="26"/>
    <rect x="312" y="158" width="26" height="26"/><rect x="338" y="158" width="26" height="26"/><rect x="364" y="158" width="26" height="26"/>
    <rect x="312" y="184" width="26" height="26"/><rect x="338" y="184" width="26" height="26"/><rect x="364" y="184" width="26" height="26"/>
  </g>
  <text x="351" y="232" text-anchor="middle" font-size="12" fill="#92400e">重なりの掛け算の総和</text>

  <!-- Arrow from input region to kernel -->
  <line x1="145" y1="123" x2="305" y2="150" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <!-- Arrow kernel to output -->
  <line x1="398" y1="171" x2="520" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Output 3x3 -->
  <text x="600" y="62" text-anchor="middle" font-size="14" fill="#334155">出力　3×3</text>
  <g stroke="#94a3b8" stroke-width="1.5" fill="none">
    <rect x="540" y="80" width="120" height="120" fill="none" stroke="#cbd5e1"/>
    <rect x="540" y="80" width="40" height="40" fill="#fecaca" stroke="#dc2626" stroke-width="2"/>
    <rect x="580" y="80" width="40" height="40"/><rect x="620" y="80" width="40" height="40"/>
    <rect x="540" y="120" width="40" height="40"/><rect x="580" y="120" width="40" height="40"/><rect x="620" y="120" width="40" height="40"/>
    <rect x="540" y="160" width="40" height="40"/><rect x="580" y="160" width="40" height="40"/><rect x="620" y="160" width="40" height="40"/>
  </g>
  <text x="560" y="106" text-anchor="middle" font-size="13" fill="#b91c1c">1値</text>

  <!-- Formula -->
  <rect x="430" y="250" width="320" height="46" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="590" y="270" text-anchor="middle" font-size="13" fill="#1e3a8a">出力サイズ = (W − K + 2P)/S + 1</text>
  <text x="590" y="288" text-anchor="middle" font-size="13" fill="#1e3a8a">= (5 − 3 + 0)/1 + 1 = 3</text>

  <!-- Slide note -->
  <text x="20" y="300" text-anchor="start" font-size="11.5" fill="#64748b">フィルタを1マスずつずらして全体を走査します。</text>
</svg>
