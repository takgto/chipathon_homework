  <text x="194" y="242" text-anchor="middle" font-size="12" fill="#1d4ed8">出力1つが <tspan font-weight="bold">全画素</tspan> を見る（画素ごとに別の重み）</text>
  <text x="194" y="260" text-anchor="middle" font-size="12" fill="#1d4ed8">重みの数 = 画素数 × 出力数 = 16 × 3 = 48</text>
  <text x="194" y="282" text-anchor="middle" font-size="11.5" fill="#64748b">画像が大きくなると重みが爆発的に増える（位置がずれると別の重み）</text>
