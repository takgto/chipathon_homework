  <text x="566" y="260" text-anchor="middle" font-size="12" fill="#1d4ed8">重みの数 = 3 × 3 = 9（重み共有：画像サイズによらない）</text>
  <text x="566" y="282" text-anchor="middle" font-size="11.5" fill="#64748b">同じ重みをどこにも当てるので、対象が動いても同じように検出できる</text>
  <rect x="16" y="308" width="728" height="42" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="380" y="327" text-anchor="middle" font-size="12.5" fill="#1e3a8a">全結合：重み = (W × H × Cin) × (W' × H' × Cout)　／　畳み込み：重み = K × K × Cin × Cout</text><text x="380" y="343" text-anchor="middle" font-size="11" fill="#475569">画像の大きさ W×H が掛かるか、フィルタの大きさ K×K だけで済むかの違い（図は Cin = Cout = 1 の例：3×3×1×1 = 9）</text>
