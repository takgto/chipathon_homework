<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" font-family="Noto Sans CJK JP, sans-serif">
  <defs>
    <marker id="tb" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="tg" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <text x="300" y="24" text-anchor="middle" font-size="17" font-weight="bold" fill="#1e3a8a">YOLOv3-tiny の構造（軽量版・2スケール検出）</text>

  <!-- input -->
  <rect x="14" y="92" width="70" height="56" rx="6" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="49" y="116" text-anchor="middle" font-size="12" fill="#334155">入力</text>
  <text x="49" y="133" text-anchor="middle" font-size="11" fill="#334155">416×416</text>

  <line x1="84" y1="120" x2="106" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#tb)"/>

  <!-- backbone (smaller) -->
  <rect x="108" y="86" width="128" height="68" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="172" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e3a8a">tiny バックボーン</text>
  <text x="172" y="129" text-anchor="middle" font-size="9.5" fill="#3b6fb6">畳み込み少なめ</text>
  <text x="172" y="143" text-anchor="middle" font-size="9.5" fill="#3b6fb6">最大プーリングで縮小</text>

  <line x1="236" y1="120" x2="258" y2="120" stroke="#2563eb" stroke-width="2" marker-end="url(#tb)"/>

  <!-- F13 -->
  <rect x="260" y="64" width="72" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="296" y="85" text-anchor="middle" font-size="12" fill="#3730a3">13×13 特徴</text>
  <text x="296" y="101" text-anchor="middle" font-size="10" fill="#6366f1">(/32)</text>

  <line x1="332" y1="89" x2="396" y2="89" stroke="#2563eb" stroke-width="2" marker-end="url(#tb)"/>
  <rect x="398" y="60" width="150" height="56" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="473" y="83" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">13×13×255</text>
  <text x="473" y="102" text-anchor="middle" font-size="11" fill="#9a3412">大きい物体</text>

  <!-- F26 -->
  <rect x="260" y="168" width="72" height="50" rx="6" fill="#e0e7ff" stroke="#6366f1"/>
  <text x="296" y="189" text-anchor="middle" font-size="12" fill="#3730a3">26×26 特徴</text>
  <text x="296" y="205" text-anchor="middle" font-size="10" fill="#6366f1">(/16)</text>

  <line x1="332" y1="193" x2="396" y2="193" stroke="#2563eb" stroke-width="2" marker-end="url(#tb)"/>
  <rect x="398" y="164" width="150" height="56" rx="6" fill="#ffedd5" stroke="#ea580c"/>
  <text x="473" y="187" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#9a3412">26×26×255</text>
  <text x="473" y="206" text-anchor="middle" font-size="11" fill="#9a3412">中〜小の物体</text>

  <!-- backbone to F26 (dashed) -->
  <path d="M150,154 C150,185 215,190 258,193" fill="none" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>

  <!-- upsample -->
  <line x1="296" y1="114" x2="296" y2="168" stroke="#0d9488" stroke-width="2" marker-end="url(#tg)"/>
  <text x="340" y="140" text-anchor="start" font-size="10" fill="#0f766e">アップサンプリング＋連結</text>

  <!-- caption -->
  <rect x="14" y="244" width="566" height="34" rx="6" fill="#fff7ed" stroke="#fdba74"/>
  <text x="300" y="259" text-anchor="middle" font-size="11" fill="#9a3412">検出スケールは2つだけ（52×52 が無い）→ 小さい物体は苦手だが、軽くて速い。</text>
  <text x="300" y="273" text-anchor="middle" font-size="11" fill="#9a3412">フルのYOLOv3（図3, 3スケール）より精度(mAP)は下がるが、FPSは上がる。</text>
</svg>
