<text x="380" y="394" text-anchor="middle" font-size="12.5" fill="#1e3a8a">入力 128×128 → 縮めて 16×16（何があるか）→ 戻して 128×128 のラベル地図。スキップ接続が細かい位置・輪郭を補う。</text>
